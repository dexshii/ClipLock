[package]
name = "cliplock-capture"
description = "ClipLock recording engine: segmented replay buffer, manual recording and clip export on top of an FFmpeg encoder process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cliplock_capture"

[[bin]]
name = "cliplock-capture"
path = "src/bin/cliplock-capture.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
