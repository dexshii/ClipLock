# Self-hosted ClipLock server: web + API + worker + PostgreSQL + MinIO behind Caddy (automatic HTTPS).
#
#   cp infrastructure/.env.example infrastructure/.env   # then edit it
#   docker compose -f infrastructure/docker-compose.yml --env-file infrastructure/.env up -d --build
#
# Any S3-compatible storage works instead of MinIO (Cloudflare R2, Backblaze B2, AWS S3, Garage):
# remove the minio services and set the S3_* variables.

name: cliplock

x-server-env: &server-env
  DATABASE_URL: postgres://cliplock:${POSTGRES_PASSWORD}@postgres:5432/cliplock
  PUBLIC_BASE_URL: https://${CLIPLOCK_DOMAIN}
  CORS_ORIGINS: https://${CLIPLOCK_DOMAIN}
  TRUST_PROXY_HOPS: 1
  MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  # Desktop clients upload directly to storage, so presigned URLs must use an address they can reach.
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://${STORAGE_DOMAIN}}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-cliplock}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cliplock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cliplock
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cliplock']
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes: [minio:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY} &&
                  mc mb --ignore-existing local/$${S3_BUCKET:-cliplock}"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-cliplock}

  api:
    build: { context: .., dockerfile: infrastructure/Dockerfile, target: api }
    restart: unless-stopped
    environment: *server-env
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: .., dockerfile: infrastructure/Dockerfile, target: worker }
    restart: unless-stopped
    environment:
      <<: *server-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  web:
    build: { context: .., dockerfile: infrastructure/Dockerfile, target: web }
    restart: unless-stopped
    environment:
      CLIPLOCK_API_URL: http://api:8080
      PUBLIC_BASE_URL: https://${CLIPLOCK_DOMAIN}
    depends_on: [api]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      CLIPLOCK_DOMAIN: ${CLIPLOCK_DOMAIN}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, api, minio]

volumes:
  postgres:
  minio:
  caddy-data:
