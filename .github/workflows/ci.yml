name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  node:
    name: TypeScript (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cliplock/shared build && pnpm --filter @cliplock/api build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @cliplock/desktop exec vite build
      - run: pnpm --filter @cliplock/web build

  docker:
    name: Server images build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  services:
    name: API + worker integration (PostgreSQL, S3, FFmpeg)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cliplock_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cliplock_test
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: S3-compatible test server (moto)
        run: |
          python3 -m venv /tmp/moto && /tmp/moto/bin/pip install -q "moto[server]"
          nohup /tmp/moto/bin/moto_server -H 127.0.0.1 -p 9000 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/ >/dev/null && break; sleep 1; done
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cliplock/shared build && pnpm --filter @cliplock/api build
      - run: pnpm --filter @cliplock/api test
      - run: pnpm --filter @cliplock/worker test

  rust-linux:
    name: Rust (Linux, real FFmpeg)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Placeholder frontend and sidecars for compile-time checks
        run: |
          mkdir -p apps/desktop/dist && echo '<html></html>' > apps/desktop/dist/index.html
          for b in ffmpeg ffprobe; do ln -sf "$(which $b)" "apps/desktop/src-tauri/binaries/$b-x86_64-unknown-linux-gnu"; done
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows (capture tests, installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch FFmpeg sidecars (checksum verified)
        run: node scripts/fetch-ffmpeg.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cliplock/shared build
      - name: Capture engine tests against the bundled Windows FFmpeg
        run: cargo test -p cliplock-capture -- --nocapture
        env:
          CLIPLOCK_FFMPEG_DIR: ${{ github.workspace }}\apps\desktop\src-tauri\binaries
      - name: Encoder and filter capabilities of this runner (informational)
        run: cargo run -p cliplock-capture --bin cliplock-capture -- probe
        env:
          CLIPLOCK_FFMPEG_DIR: ${{ github.workspace }}\apps\desktop\src-tauri\binaries
      - name: Desktop Duplication smoke test (informational; CI runners usually have no interactive desktop)
        continue-on-error: true
        run: cargo run -p cliplock-capture --bin cliplock-capture -- record --source monitor:0 --height native --fps 30 --duration 3 --synthetic-audio --out "${{ runner.temp }}\ddagrab.mp4"
        env:
          CLIPLOCK_FFMPEG_DIR: ${{ github.workspace }}\apps\desktop\src-tauri\binaries
      - run: cargo clippy -p cliplock-desktop --all-targets -- -D warnings
      - run: cargo test -p cliplock-desktop
      - name: Build installer (unsigned)
        run: pnpm --filter @cliplock/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: cliplock-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
